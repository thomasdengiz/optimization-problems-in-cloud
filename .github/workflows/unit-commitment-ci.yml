name: Unit Commitment CI

on:
  push:
    paths:
      - "unit-commitment/**"
      - ".github/workflows/unit-commitment-ci.yml"
  pull_request:
    paths:
      - "unit-commitment/**"
      - ".github/workflows/unit-commitment-ci.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "unit-commitment/requirements-dev.txt"

      - name: Install dependencies
        working-directory: unit-commitment
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile Python files
        working-directory: unit-commitment
        run: python -m compileall data solver tests e2e run_demo.py

      - name: Run unit and API tests
        working-directory: unit-commitment
        run: pytest

      - name: Build Docker image
        run: docker build -t unit-commitment-api:ci ./unit-commitment

      - name: Start the Docker container
        run: |
          docker run -d --name uc-api -p 8000:7860 unit-commitment-api:ci || true
          # Falls der Container sofort stirbt, zeigen wir hier direkt die Logs:
          docker logs uc-api || true
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health && exit 0
            sleep 2
          done
          docker logs uc-api
          exit 1

      - name: Install browser for end-to-end tests
        working-directory: unit-commitment
        run: python -m playwright install --with-deps chromium

      - name: Serve the frontend
        working-directory: unit-commitment
        run: nohup python -m http.server 3000 --directory frontend > /dev/null 2>&1 &

      - name: Run end-to-end tests against the container
        working-directory: unit-commitment
        env:
          E2E_EXTERNAL: "1"
        run: pytest e2e

      - name: Show container logs on failure
        if: failure()
        run: docker logs uc-api

  # Continuous delivery: runs only on pushes to main and only if all tests above passed.
  # Builds the image, publishes it to Azure Container Registry and rolls it out to Azure Container Apps.
  deploy-backend:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # passwordless login to Azure (OIDC)
    env:
      AZURE_RESOURCE_GROUP: rg-unit-commitment
      AZURE_CONTAINER_APP: unit-commitment-solver
      AZURE_REGISTRY: ucregistrythomas.azurecr.io

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.AZURE_REGISTRY }}
          username: ucregistrythomas
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push the image
        run: |
          IMAGE="${AZURE_REGISTRY}/unit-commitment-api"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          docker build -t "${IMAGE}:${GITHUB_SHA}" ./unit-commitment
          docker push "${IMAGE}:${GITHUB_SHA}"

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set Azure Container Registry credentials in Azure
        run: |
          az containerapp registry set \
            --name "${AZURE_CONTAINER_APP}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --server "${AZURE_REGISTRY}" \
            --username "ucregistrythomas" \
            --password "${{ secrets.ACR_PASSWORD }}"

      - name: Roll out the new image
        run: |
          az containerapp update \
            --name "${AZURE_CONTAINER_APP}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --image "${IMAGE}:${GITHUB_SHA}" \
            --registry-server "${AZURE_REGISTRY}" \
            --registry-username "ucregistrythomas" \
            --registry-password "${{ secrets.ACR_PASSWORD }}"