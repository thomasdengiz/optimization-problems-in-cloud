<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unit Commitment Optimizer</title>
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Elements with data-i18n get their text from i18n.js in the selected language -->
  <header>
    <div>
      <h1 data-i18n="page.title"></h1>
      <p data-i18n="page.subtitle"></p>
    </div>
    <div class="language">
      <span id="language-label" data-i18n="language.label"></span>
      <button id="language" data-testid="language" class="language-trigger" type="button"
        aria-labelledby="language-label" aria-haspopup="listbox" aria-expanded="false">
        <img src="flags/de.svg" alt="Flag of Germany">
        <span>Deutsch</span>
        <span class="language-caret" aria-hidden="true">▾</span>
      </button>
      <div id="language-options" class="language-options" role="listbox" aria-labelledby="language-label" hidden>
        <button type="button" role="option" data-language="de" aria-selected="true">
          <img src="flags/de.svg" alt="Flag of Germany"><span>Deutsch</span>
        </button>
        <button type="button" role="option" data-language="en" aria-selected="false">
          <img src="flags/en.svg" alt="Flag of the United Kingdom"><span>English</span>
        </button>
      </div>
    </div>
  </header>

  <div id="server-banner" data-testid="server-banner" class="banner" data-i18n="banner.starting"></div>

  <main>
    <section class="panel" id="inputs">
      <h2 data-i18n="inputs.heading"></h2>

      <label data-i18n="country.label"></label>
      <div id="map" data-testid="map"></div>
      <p id="country-info" data-testid="country-info" class="hint"></p>

      <label for="method" data-i18n="method.label"></label>
      <select id="method" data-testid="method"></select>
      <p id="method-info" data-testid="method-info" class="info"></p>

      <div id="params-exact" class="params">
        <label for="time-limit" data-i18n="timeLimit.label"></label>
        <input id="time-limit" data-testid="time-limit" type="number" min="1" max="300" value="60">
        <p class="hint" data-i18n="timeLimit.hint"></p>
        <label for="mip-gap" data-i18n="mipGap.label"></label>
        <input id="mip-gap" data-testid="mip-gap" type="number" min="0" max="100" step="0.1" value="1">
        <p class="hint" data-i18n="mipGap.hint"></p>
      </div>

      <label for="scenario" data-i18n="scenario.label"></label>
      <select id="scenario" data-testid="scenario">
        <option value="small" data-i18n="scenario.small"></option>
        <option value="medium" data-i18n="scenario.medium"></option>
        <option value="large" data-i18n="scenario.large"></option>
      </select>
      <p id="scenario-info" data-testid="scenario-info" class="info"></p>

      <label for="horizon" data-i18n="horizon.label"></label>
      <select id="horizon" data-testid="horizon">
        <option value="day" data-i18n="horizon.day"></option>
        <option value="week" data-i18n="horizon.week"></option>
        <option value="month" data-i18n="horizon.month"></option>
      </select>
      <p id="horizon-info" data-testid="horizon-info" class="info"></p>

      <label for="month" data-i18n="month.label"></label>
      <select id="month" data-testid="month"></select>
      <p id="month-info" data-testid="month-info" class="info"></p>

      <button id="solve" data-testid="solve-button" data-i18n="solve.button" disabled></button>
      <p id="status" data-testid="status" class="hint" role="status"></p>
    </section>

    <section class="panel" id="outputs">
      <h2 data-i18n="result.heading"></h2>
      <p id="computing" data-testid="computing" class="computing" role="status" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span data-i18n="result.computing"></span>
      </p>
      <p id="no-result" class="hint" data-i18n="result.none"></p>

      <div id="result" hidden>
        <div class="cards">
          <div class="card"><span data-i18n="result.cost"></span><strong id="r-cost" data-testid="r-cost"></strong></div>
          <div class="card"><span data-i18n="result.solverTime"></span><strong id="r-solver-time" data-testid="r-solver-time"></strong></div>
          <div class="card"><span data-i18n="result.buildTime"></span><strong id="r-build-time" data-testid="r-build-time"></strong></div>
          <div class="card"><span data-i18n="result.totalTime"></span><strong id="r-total-time" data-testid="r-total-time"></strong></div>
          <div class="card"><span data-i18n="result.variables"></span><strong id="r-vars" data-testid="r-vars"></strong></div>
          <div class="card"><span data-i18n="result.gap"></span><strong id="r-gap" data-testid="r-gap"></strong></div>
          <div class="card"><span data-i18n="result.feasible"></span><strong id="r-feasible" data-testid="r-feasible"></strong></div>
        </div>
        <p id="limit-note" data-testid="limit-note" class="note" data-i18n="result.limitReached" hidden></p>
        <ul id="reasons" data-testid="reasons"></ul>

        <h3 data-i18n="profile.heading"></h3>
        <div id="days" data-testid="days"></div>
      </div>
    </section>
  </main>

  <script src="vendor/leaflet.js"></script>
  <script src="vendor/chart.umd.js"></script>
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
