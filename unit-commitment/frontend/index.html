<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unit Commitment Optimizer</title>
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Elements with data-i18n get their text from i18n.js in the selected language -->
  <header>
    <div>
      <h1 data-i18n="page.title"></h1>
      <p data-i18n="page.subtitle"></p>
    </div>
    <div class="language">
      <span id="language-label" data-i18n="language.label"></span>
      <button id="language" data-testid="language" class="language-trigger" type="button"
        aria-labelledby="language-label" aria-haspopup="listbox" aria-expanded="false">
        <img src="flags/de.svg" alt="Flag of Germany">
        <span>Deutsch</span>
        <span class="language-caret" aria-hidden="true">▾</span>
      </button>
      <div id="language-options" class="language-options" role="listbox" aria-labelledby="language-label" hidden>
        <button type="button" role="option" data-language="de" aria-selected="true">
          <img src="flags/de.svg" alt="Flag of Germany"><span>Deutsch</span>
        </button>
        <button type="button" role="option" data-language="en" aria-selected="false">
          <img src="flags/en.svg" alt="Flag of the United Kingdom"><span>English</span>
        </button>
      </div>
    </div>
  </header>

  <div id="server-banner" data-testid="server-banner" class="banner" data-i18n="banner.starting"></div>

  <main>
    <section class="panel" id="inputs">
      <h2 data-i18n="inputs.heading"></h2>

      <label data-i18n="country.label"></label>
      <div id="map" data-testid="map"></div>
      <p id="country-info" data-testid="country-info" class="hint"></p>

      <label for="method" data-i18n="method.label"></label>
      <select id="method" data-testid="method"></select>
      <p id="method-info" data-testid="method-info" class="info"></p>

      <!-- Only shown for "Comparison of different methods": which methods take part. The checkboxes are created in app.js. -->
      <div id="params-compare" class="params" hidden>
        <label data-i18n="compare.label"></label>
        <div id="compare-methods" data-testid="compare-methods" class="checks"></div>
        <p class="hint" data-i18n="compare.hint"></p>
      </div>

      <div id="params-time-limit" class="params">
        <label for="time-limit" data-i18n="timeLimit.label"></label>
        <input id="time-limit" data-testid="time-limit" type="number" min="1" max="300" value="60">
        <p id="time-limit-hint" class="hint"></p>
      </div>

      <div id="params-exact" class="params method-params">
        <h4 class="param-title" data-i18n="method.exact"></h4>
        <label for="mip-gap" data-i18n="mipGap.label"></label>
        <input id="mip-gap" data-testid="mip-gap" type="number" min="0" max="100" step="0.1" value="1">
        <p class="hint" data-i18n="mipGap.hint"></p>
      </div>

      <!-- Algorithm parameters of the metaheuristics. The start values come from the server (GET /methods). -->
      <div id="params-ea" class="params method-params" hidden>
        <h4 class="param-title" data-i18n="method.ea"></h4>
        <label for="opt-population_size" data-i18n="param.population_size.label"></label>
        <input id="opt-population_size" data-testid="opt-population_size" type="number" min="4" max="200" step="1">
        <p class="hint" data-i18n="param.population_size.hint"></p>
        <label for="opt-generations" data-i18n="param.generations.label"></label>
        <input id="opt-generations" data-testid="opt-generations" type="number" min="1" max="5000" step="1">
        <p class="hint" data-i18n="param.generations.hint"></p>
        <label for="opt-mutation_rate" data-i18n="param.mutation_rate.label"></label>
        <input id="opt-mutation_rate" data-testid="opt-mutation_rate" type="number" min="0" max="1" step="0.001">
        <p class="hint" data-i18n="param.mutation_rate.hint"></p>
        <label for="opt-crossover_rate" data-i18n="param.crossover_rate.label"></label>
        <input id="opt-crossover_rate" data-testid="opt-crossover_rate" type="number" min="0" max="1" step="0.05">
        <p class="hint" data-i18n="param.crossover_rate.hint"></p>
      </div>

      <div id="params-pso" class="params method-params" hidden>
        <h4 class="param-title" data-i18n="method.pso"></h4>
        <label for="opt-swarm_size" data-i18n="param.swarm_size.label"></label>
        <input id="opt-swarm_size" data-testid="opt-swarm_size" type="number" min="2" max="200" step="1">
        <p class="hint" data-i18n="param.swarm_size.hint"></p>
        <label for="opt-iterations" data-i18n="param.iterations.label"></label>
        <input id="opt-iterations" data-testid="opt-iterations" type="number" min="1" max="5000" step="1">
        <p class="hint" data-i18n="param.iterations.hint"></p>
        <label for="opt-inertia" data-i18n="param.inertia.label"></label>
        <input id="opt-inertia" data-testid="opt-inertia" type="number" min="0" max="2" step="0.05">
        <p class="hint" data-i18n="param.inertia.hint"></p>
        <label for="opt-cognitive" data-i18n="param.cognitive.label"></label>
        <input id="opt-cognitive" data-testid="opt-cognitive" type="number" min="0" max="4" step="0.1">
        <p class="hint" data-i18n="param.cognitive.hint"></p>
        <label for="opt-social" data-i18n="param.social.label"></label>
        <input id="opt-social" data-testid="opt-social" type="number" min="0" max="4" step="0.1">
        <p class="hint" data-i18n="param.social.hint"></p>
      </div>

      <div id="params-seed" class="params method-params" hidden>
        <h4 class="param-title" data-i18n="compare.seedTitle"></h4>
        <label for="opt-seed" data-i18n="param.seed.label"></label>
        <input id="opt-seed" data-testid="opt-seed" type="number" min="0" step="1">
        <p class="hint" data-i18n="param.seed.hint"></p>
      </div>

      <label for="scenario" data-i18n="scenario.label"></label>
      <select id="scenario" data-testid="scenario">
        <option value="small" data-i18n="scenario.small"></option>
        <option value="medium" data-i18n="scenario.medium"></option>
        <option value="large" data-i18n="scenario.large"></option>
      </select>
      <p id="scenario-info" data-testid="scenario-info" class="info"></p>

      <label for="horizon" data-i18n="horizon.label"></label>
      <select id="horizon" data-testid="horizon">
        <option value="day" data-i18n="horizon.day"></option>
        <option value="week" data-i18n="horizon.week"></option>
        <option value="month" data-i18n="horizon.month"></option>
      </select>
      <p id="horizon-info" data-testid="horizon-info" class="info"></p>

      <label for="month" data-i18n="month.label"></label>
      <select id="month" data-testid="month"></select>
      <p id="month-info" data-testid="month-info" class="info"></p>

      <button id="solve" data-testid="solve-button" data-i18n="solve.button" disabled></button>
      <p id="status" data-testid="status" class="hint" role="status"></p>
    </section>

    <section class="panel" id="outputs">
      <h2 data-i18n="result.heading"></h2>
      <p id="computing" data-testid="computing" class="computing" role="status" hidden>
        <span class="spinner" aria-hidden="true"></span>
        <span>
          <span data-i18n="result.computing"></span>
          <span id="computing-detail" data-testid="computing-detail" class="computing-detail"></span>
        </span>
      </p>
      <p id="no-result" class="hint" data-i18n="result.none"></p>

      <div id="result" hidden>
        <p id="run-info" data-testid="run-info" class="info"></p>
        <div id="single-details">
        <div class="cards">
          <div class="card"><span data-i18n="result.cost"></span><strong id="r-cost" data-testid="r-cost"></strong></div>
          <div class="card"><span data-i18n="result.solverTime"></span><strong id="r-solver-time" data-testid="r-solver-time"></strong></div>
          <div class="card"><span data-i18n="result.buildTime"></span><strong id="r-build-time" data-testid="r-build-time"></strong></div>
          <div class="card"><span data-i18n="result.totalTime"></span><strong id="r-total-time" data-testid="r-total-time"></strong></div>
          <div class="card"><span data-i18n="result.variables"></span><strong id="r-vars" data-testid="r-vars"></strong></div>
          <div class="card"><span data-i18n="result.gap"></span><strong id="r-gap" data-testid="r-gap"></strong></div>
          <div class="card"><span data-i18n="result.feasible"></span><strong id="r-feasible" data-testid="r-feasible"></strong></div>
        </div>
        <p id="limit-note" data-testid="limit-note" class="note" data-i18n="result.limitReached" hidden></p>
        <ul id="reasons" data-testid="reasons"></ul>
        </div>

        <div class="view-head">
          <h3 data-i18n="profile.heading"></h3>
          <div class="view-toggle">
            <button type="button" data-view="load" data-testid="view-load" aria-pressed="true" data-i18n="view.load"></button>
            <button type="button" data-view="mix" data-testid="view-mix" aria-pressed="false" data-i18n="view.mix"></button>
            <button type="button" data-view="compare" data-testid="view-compare" aria-pressed="false" data-i18n="view.compare" hidden></button>
          </div>
        </div>

        <!-- After a comparison: which of the compared methods the load profile / generation mix shows -->
        <div id="method-picker" class="method-picker" hidden>
          <label for="compare-method" data-i18n="compare.showMethod"></label>
          <select id="compare-method" data-testid="compare-method"></select>
        </div>
        <div id="days" data-testid="days"></div>

        <div id="comparison" data-testid="comparison" hidden>
          <h4 data-i18n="compare.costHeading"></h4>
          <div class="chart-box compare-box"><canvas id="compare-cost-chart" data-testid="compare-cost-chart"></canvas></div>
          <h4 data-i18n="compare.percentHeading"></h4>
          <div class="chart-box compare-box"><canvas id="compare-percent-chart" data-testid="compare-percent-chart"></canvas></div>
          <div class="table-wrap">
            <table id="compare-table" data-testid="compare-table">
              <thead>
                <tr>
                  <th data-i18n="compare.col.method"></th>
                  <th data-i18n="compare.col.cost"></th>
                  <th data-i18n="compare.col.percent"></th>
                  <th data-i18n="compare.col.time"></th>
                  <th data-i18n="compare.col.status"></th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="vendor/leaflet.js"></script>
  <script src="vendor/chart.umd.js"></script>
  <script src="config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
